<!-- This page will be redirected from any url if you are not logged in -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Global CSS  -->
    <link rel="stylesheet" href="global.css">

    <title>Login</title>
</head>
<body>
<div class="page-content">
    <div class="page-header-section">
        <h1 class="page-header">LOGIN TO FABFLIX</h1>
    </div>
    <!-- Set the method to POST to avoid showing the username/password in the URL
         The default action is disabled to allow your own implementation. -->
    <div class="form-card">
        <form class="form-section" id="login_form" method="post" action="#">
            <div class="form-area">
                <label for="email" class="form-label">Email:</label>
                <input id="email" class="form-input" name="email" placeholder="Enter Email" type="text"/>
            </div>
            <div class="form-area">
                <label for="password" class="form-label">Password:</label>
                <input id="password" class="form-input" name="password" placeholder="Enter Password" type="password"/>
            </div>
            <div class="g-recaptcha" data-sitekey="6Lc5cuIoAAAAAKcAmZnbIimwEU8RgupBPltHXteD"></div>
            <input class="form-button" type="submit" value="Login"/>
        </form>
    </div>
    <div class="error-message" id="login_error_message"></div>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- reCAPTCHA script -->
<script src='https://www.google.com/recaptcha/api.js' type="text/javascript"></script>
<!-- include our own JS file -->
<script src="login.js"></script>

</body>
</html>
