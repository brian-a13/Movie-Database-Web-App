<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <!-- Global CSS  -->
  <link rel="stylesheet" href="../global.css">

  <title>New Single Movie</title>
</head>
<body>
<div class="navbar">
  <div class="all-content">
    <a class="nav-button" href="metadata.html">Metadata</a>
    <a class="nav-button" href="new-single-star.html">New Star</a>
    <a class="nav-button" href="new-single-movie.html">New Movie</a>
  </div>
</div>
<div class="page-content">
  <div class="page-header-section">
    <h1 class="page-header">New Movie</h1>
  </div>
  <div class="form-card">
    <form class="form-section" id="new_movie_form" method="post" action="#">
      <div class="form-area">
        <label for="movie_title" class="form-label">Movie Title:</label>
        <input id="movie_title" class="form-input" name="movie_title" placeholder="Movie Title" type="text"/>
      </div>
      <div class="form-area">
        <label for="movie_year" class="form-label">Movie Year:</label>
        <input id="movie_year" class="form-input" name="movie_year" placeholder="Movie Year" type="number"/>
      </div>
      <div class="form-area">
        <label for="movie_director" class="form-label">Movie Director:</label>
        <input id="movie_director" class="form-input" name="movie_director" placeholder="Movie Director" type="text"/>
      </div>
      <div class="form-area">
        <label for="star_name" class="form-label">Star Name:</label>
        <input id="star_name" class="form-input" name="star_name" placeholder="Star Name" type="text"/>
      </div>
      <div class="form-area">
        <label for="birth_year" class="form-label">Birth Year:</label>
        <input id="birth_year" class="form-input" name="birth_year" placeholder="Birth Year" type="number"/>
      </div>
      <div class="form-area">
        <label for="genre_name" class="form-label">Genre Name:</label>
        <input id="genre_name" class="form-input" name="genre_name" placeholder="Genre name" type="text"/>
      </div>
      <input class="form-button" type="submit" value="Add New Movie"/>
    </form>
  </div>
  <div class="success-message" id="success_message"></div>
  <div class="error-message" id="error_message"></div>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- include our own JS file -->
<script src="new-single-movie.js"></script>

</body>
</html>
