<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Global CSS  -->
    <link rel="stylesheet" href="global.css">

    <title>Results</title>
</head>
<body>
<!-- Each page needs to have this for navigation -->
<div class="navbar">
    <div class="all-content">
        <!-- As we go, add buttons and refactor in every html file -->
        <a class="nav-button" href="main.html">Home</a>
        <a class="nav-button" href="top-20.html">Top 20</a>
        <a class="nav-button" href="shopping-cart.html">Checkout</a>
        <!-- Implement search results button when you find out how to "cache" it exactly   -->
    </div>
</div>

<div class="page-content">

    <div class="page-header-section">
        <h1 class="page-subheader">SEARCH FOR MORE!</h1>
    </div>
    <form class="full-text-search-form" name="fullTextForm" id="fullTextForm" method="get" action="results.html">
        <label>
            <input type="text" name="full_text_search" id="autocomplete"
                   class="full-text-box"
                   placeholder="Full Text Movie Search"/>
        </label>
        <input type="submit" value="Full Text Search"/>
    </form>
    <p class="or-search-like">Or search with:</p>
    <form class="search-form" name="searchForm" id="searchForm" method="get" action="results.html">
        <label>
            <input type="text" placeholder="Title" name="title" id="title"/>
        </label>
        <label>
            <input type="number" placeholder="Year" name="year" id="year"/> <br/>
        </label>
        <label>
            <input type="text" placeholder="Director" name="director" id="director"/> <br/>
        </label>
        <label>
            <input type="text" placeholder="Star Name" name="star_name" id="star_name"/> <br/>
        </label>
        <input type="submit" value="Search"/>
    </form>

    <div class="page-header-section">
        <h1 class="page-header">RESULTS</h1>
    </div>
    <div class="sort-section">
        <form class="display" name="displayForm" id="displayForm" method="get" action="*">
            <label for="order-types">Order By:</label>
            <select name="order-types" id="order-types">
                <option value="0">Title Inc, Rating Dec</option>
                <option value="1">Title Inc, Rating Inc</option>
                <option value="2">Title Dec, Rating Dec</option>
                <option value="3">Title Dec, Rating Inc</option>
                <option value="4">Rating Dec, Title Inc</option>
                <option value="5">Rating Dec, Title Dec</option>
                <option value="6">Rating Inc, Title Inc</option>
                <option value="7">Rating Inc, Title Dec</option>
            </select>
            <label for="num-results-per-page">Results per Page:</label>
            <select name="num-results-per-page" id="num-results-per-page">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <input type="submit" value="Update"/>
        </form>
    </div>
    <div class="table-responsive">
        <table id=movie_list_table class="table table-striped">
            <!-- Create a table header -->
            <thead>
            <tr>
                <!-- Titles of each column-->
                <th>Title</th>
                <th>Year</th>
                <th>Director</th>
                <th>Genres</th>
                <th>Stars</th>
                <th>Rating</th>
                <th>Cart</th>
            </tr>
            </thead>
            <!-- Table body is left empty here, will be populated with the data retrieved with top-20.js -->
            <!-- Again, id "movie_list_table_body" is useful for jQuery to find this html element -->
            <tbody id=movie_list_table_body></tbody>
        </table>
    </div>
    <div class="pagination-buttons-section">
        <form name="previousForm" id="previousForm" method="get" action="*">
            <label>
                <input class="pagination-button" id="previous-button" type="submit" value="Previous Page"/>
            </label>
        </form>
        <p class="current-page-number"></p>
        <form name="nextForm" id="nextForm" method="get" action="*">
            <label>
                <input class="pagination-button" id="next-button" type="submit" value="Next Page"/>
            </label>
        </form>
    </div>
</div>


<!-- Load jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- include jquery autocomplete JS  -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.devbridge-autocomplete/1.4.11/jquery.autocomplete.min.js"></script>


<!-- Load our own JS file -->
<!-- The path is relative to top-20.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
     otherwise the url is relative to the root path-->
<script src="results.js"></script>
</body>
</html>
