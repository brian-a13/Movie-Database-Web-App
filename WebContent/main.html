<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Global CSS  -->
    <link rel="stylesheet" href="global.css">

    <title>Main</title>
</head>
<body>
<div class="navbar">
    <div class="all-content">
        <!-- As we go, add buttons and refactor in every html file -->
        <a class="nav-button" href="main.html">Home</a>
        <a class="nav-button" href="top-20.html">Top 20</a>
        <a class="nav-button" href="shopping-cart.html">Checkout</a>
    </div>
</div>
<div class="page-content">
    <div class="page-header-section">
        <h1 class="page-header">WELCOME TO FABFLIX</h1>
    </div>

    <div class="page-header-section">
        <h1 class="page-subheader">SEARCH</h1>
    </div>
    <form class="full-text-search-form" name="fullTextForm" id="fullTextForm" method="get" action="results.html">
        <label>
            <input type="text" name="full_text_search" id="autocomplete"
                   class="full-text-box"
                   placeholder="Full Text Movie Search"/>
        </label>
        <input type="submit" value="Full Text Search"/>
    </form>
    <p class="or-search-like">Or search with:</p>
    <form class="search-form" name="searchForm" id="searchForm" method="get" action="results.html">
        <label>
            <input type="text" placeholder="Title" name="title"/>
        </label>
        <label>
            <input type="number" placeholder="Year" name="year"/> <br/>
        </label>
        <label>
            <input type="text" placeholder="Director" name="director"/> <br/>
        </label>
        <label>
            <input type="text" placeholder="Star Name" name="star_name"/> <br/>
        </label>
        <input type="submit" value="Search"/>
    </form>

    <div class="page-header-section">
        <h1 class="page-subheader">BROWSE</h1>
    </div>
    <h2 class="browse-titles">
        by Genre:
    </h2>
    <div class="hyperlink-section">
        <div class="all-hyperlinks" id="genre-options">
        </div>
    </div>
    <h2 class="browse-titles">
        by Title:
    </h2>
    <div class="hyperlink-section">
        <div class="all-hyperlinks" id="start-with-options">
        </div>
    </div>

</div>


<!-- Load jQuery and Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
<!-- include jquery autocomplete JS  -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.devbridge-autocomplete/1.4.11/jquery.autocomplete.min.js"></script>


<!-- Load our own JS file -->
<!-- The path is relative to top-20.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
     otherwise the url is relative to the root path-->
<script src="main.js"></script>

</body>
</html>
