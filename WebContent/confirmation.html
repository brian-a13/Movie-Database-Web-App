<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- Global CSS  -->
    <link rel="stylesheet" href="global.css">

    <title>Confirmation</title>
</head>
<body>
<!-- Each page needs to have this for navigation -->
<div class="navbar">
    <div class="all-content">
        <!-- As we go, add buttons and refactor in every html file -->
        <a class="nav-button" href="main.html">Home</a>
        <a class="nav-button" href="top-20.html">Top 20</a>
        <a class="nav-button" href="shopping-cart.html">Checkout</a>
    </div>
</div>

<div class="page-content">
    <div class="page-header-section">
        <i class="page-logos material-icons">movie</i>
        <h1 class="page-header">Confirmation</h1>
    </div>

    <div class="table-responsive">
        <table id=movie_info_table class="table table-striped">
            <thead>
            <tr>
                <th>Sale ID</th>
                <th>Title</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total per Movie</th>
            </tr>
            </thead>
            <!-- Table body is left empty here, will be populated with the data retrieved with single-star.js -->
            <!-- single-star.js will find this html element by its id "movie_table_body" -->
            <tbody id=confirmation_table_body></tbody>
        </table>
    </div>

    <!-- Add text above the button -->


    <!-- Right-align the button and add text between the table and the button -->
    <div class="text-right" style="margin-top: 10px;">
        <p><strong id="subtotal">Subtotal: $0</strong></p>
    </div>

</div>


<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<!-- Load our own JS file -->
<!-- The path is relative to single-star.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
     otherwise the url is relative to the root path-->
<script src="confirmation.js"></script>
</body>


</html>
